server:
  port: 8082

spring:
  application:
    name: relic-core

relic:
  request:
    timeout-ms: 180000
    max-concurrent-streams: 8
  multimodal:
    audio:
      max-base64-chars: 10485760
      allowed-formats: mp3,mpeg,wav,webm,ogg,m4a,mp4
  openai-compatible:
    connect-timeout-ms: 20000
    request-timeout-ms: 300000
  tools:
    execution-timeout-ms: 60000
    executor:
      pool-size: 4
      queue-size: 32
  web-search:
    max-results: 8
    timeout-ms: 12000
    auto-index-on-import: true
    max-redirects: 5
    max-download-bytes: 2097152
    max-content-chars: 12000
    user-agent: Mozilla/5.0 (compatible; RelicBot/1.0)
  openclaw:
    gateway-path: ${user.dir}/../relic-gateway
    config-path: ${user.home}/.openclaw/openclaw.json
  workspace:
    path: ${RELIC_WORKSPACE_PATH:${user.dir}/../workspace}
    # true 时 read_file 允许读取工作区外绝对路径文件
    allow-outside-read: true
  deepseek:
    # 推荐改为环境变量注入，避免硬编码
    api-key: ${DEEPSEEK_API_KEY:}
    # DeepSeek 模型名，可切换为支持多模态输入的模型版本
    model: deepseek-chat
    # 连接超时（仅握手阶段）
    connect-timeout-ms: 20000
    # 整个请求最大等待时长，长推理建议 >= 300000
    request-timeout-ms: 300000
    # 流式空闲超时，0 表示关闭空闲熔断
    idle-timeout-ms: 180000
  qwen:
    api-key: ${QWEN_API_KEY:${DASHSCOPE_API_KEY:}}
    url: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
    # Qwen 文本模型（DashScope OpenAI 兼容）。当前临时 key 对 qwen-vl-plus-latest 会返回 403 access_denied。
    model: qwen-plus
  kimi:
    api-key: ${KIMI_API_KEY:}
    # Kimi 多模态模型（Moonshot OpenAI 兼容）
    model: kimi-k2.5
  router:
    # 主模型 provider 名称（默认 deepseek）
    primary-provider: deepseek
    # 工具调用优先使用的 provider（建议支持多模态）
    tool-provider: qwen
    # 检测到图片/音频输入时的 provider 优先级（逗号分隔）
    multimodal-providers: qwen,kimi
    # 顾问 provider 列表（逗号分隔），用于 MULTI 模式
    advisors: deepseek,kimi,qwen
    advisor-timeout-ms: 90000
    advisor-executor:
      pool-size: 4
      queue-size: 16
    # 开启后会优先调用 LocalIntentClassifier（若存在实现 Bean）
    enable-local-classifier: true
    # 本地语义分类最长等待时间，建议 >= classify-timeout-ms
    local-classifier-budget-ms: 9000
    # 本地模型仅用于语义分类和云端断连时的兜底回答
    local-model:
      endpoint: http://127.0.0.1:11434
      model: gemma3:1b
      disable-thinking: true
      # 分类超时调高，降低冷启动/排队导致的误回退
      classify-timeout-ms: 8000
      answer-timeout-ms: 12000
      # 会话自动命名（新对话）超时与长度
      title-timeout-ms: 4000
      title-max-length: 18

  chat:
    auto-title:
      enabled: true
      fallback-max-length: 18

  stream:
    watchdog:
      # 是否启用统一流式看门狗（对所有 provider 生效）
      enabled: true
      # 超过该空闲时长未收到任何 chunk 则触发超时
      idle-timeout-ms: 180000
      # 看门狗轮询检查间隔
      check-interval-ms: 3000

  rag:
    enabled: true
    http:
      connect-timeout-ms: 10000
      read-timeout-ms: 60000
    embedding:
      # 可选: hashing | openai-compatible
      provider: hashing
      # hashing 模式的维度
      dimensions: 256
      openai-compatible:
        # 兼容 OpenAI 的 embeddings 接口（OpenAI/DeepSeek/Ollama 兼容网关都可）
        url: https://api.openai.com/v1/embeddings
        model: text-embedding-3-small
        # 优先使用本字段；为空时回退 relic.deepseek.api-key / relic.qwen.api-key / relic.kimi.api-key
        api-key: ${OPENAI_API_KEY:}
        # text-embedding-3-small 默认 1536
        dimensions: 1536
    vector:
      # 可选: memory | chroma
      provider: memory
      # 与 embedding 维度保持一致，chroma 模式建议设置为 1536
      expected-dimensions: 1536
      chroma:
        scheme: http
        host: 127.0.0.1
        port: 8000
        api-prefix: /api/v1
        collection-name: relic_documents
    ingest:
      auto-index-on-upload: false
      chunk-size: 1000
      chunk-overlap: 150
      max-supported-file-bytes: 10485760
    retrieval:
      top-k: 4
      min-score: 0.0

